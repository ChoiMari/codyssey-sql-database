<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">도서관 대여 관리 ERD</title>
  <desc id="desc">회원, 대여, 도서, 카테고리, 저자, 도서 저자 연결 테이블의 관계</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 12; }
      .head { fill: #dbeafe; stroke: #334155; stroke-width: 2; rx: 12; }
      .title { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .field { font: 14px Arial, sans-serif; fill: #334155; }
      .key { font: 700 13px Arial, sans-serif; fill: #1d4ed8; }
      .rel { fill: none; stroke: #64748b; stroke-width: 2.5; }
      .label { font: 700 14px Arial, sans-serif; fill: #475569; }
      .page-title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="820"/>
  <text class="page-title" x="40" y="42">도서관 대여 관리 ERD</text>

  <!-- 관계선은 박스보다 먼저 그려 겹침을 줄인다. -->
  <path class="rel" marker-end="url(#arrow)" d="M 300 186 H 420"/>
  <text class="label" x="325" y="176">1 : N</text>
  <path class="rel" marker-end="url(#arrow)" d="M 550 278 V 470"/>
  <text class="label" x="560" y="382">1 : N</text>
  <path class="rel" marker-end="url(#arrow)" d="M 300 596 H 420"/>
  <text class="label" x="325" y="586">1 : N</text>
  <path class="rel" marker-end="url(#arrow)" d="M 680 186 H 780 V 530 H 820"/>
  <text class="label" x="700" y="176">1 : N</text>
  <path class="rel" marker-end="url(#arrow)" d="M 950 278 V 470"/>
  <text class="label" x="960" y="382">1 : N</text>

  <!-- categories -->
  <rect class="box" x="40" y="90" width="260" height="192"/>
  <rect class="head" x="40" y="90" width="260" height="48"/>
  <text class="title" x="60" y="121">categories</text>
  <text class="key" x="60" y="162">PK  category_id</text>
  <text class="field" x="60" y="190">category_name (UNIQUE)</text>
  <text class="field" x="60" y="218">description</text>

  <!-- books -->
  <rect class="box" x="420" y="70" width="260" height="208"/>
  <rect class="head" x="420" y="70" width="260" height="48"/>
  <text class="title" x="440" y="101">books</text>
  <text class="key" x="440" y="142">PK  book_id</text>
  <text class="key" x="440" y="168">FK  category_id</text>
  <text class="field" x="440" y="194">isbn (UNIQUE)</text>
  <text class="field" x="440" y="220">title, published_on</text>
  <text class="field" x="440" y="246">total_copies</text>

  <!-- authors -->
  <rect class="box" x="820" y="90" width="260" height="192"/>
  <rect class="head" x="820" y="90" width="260" height="48"/>
  <text class="title" x="840" y="121">authors</text>
  <text class="key" x="840" y="162">PK  author_id</text>
  <text class="field" x="840" y="190">author_name</text>
  <text class="field" x="840" y="218">country, birth_date</text>

  <!-- members -->
  <rect class="box" x="40" y="490" width="260" height="218"/>
  <rect class="head" x="40" y="490" width="260" height="48"/>
  <text class="title" x="60" y="521">members</text>
  <text class="key" x="60" y="562">PK  member_id</text>
  <text class="field" x="60" y="590">member_name</text>
  <text class="field" x="60" y="618">email (UNIQUE)</text>
  <text class="field" x="60" y="646">phone, joined_on</text>
  <text class="field" x="60" y="674">membership_status</text>

  <!-- loans -->
  <rect class="box" x="420" y="470" width="260" height="238"/>
  <rect class="head" x="420" y="470" width="260" height="48"/>
  <text class="title" x="440" y="501">loans</text>
  <text class="key" x="440" y="542">PK  loan_id</text>
  <text class="key" x="440" y="568">FK  member_id</text>
  <text class="key" x="440" y="594">FK  book_id</text>
  <text class="field" x="440" y="622">loaned_on</text>
  <text class="field" x="440" y="650">due_on</text>
  <text class="field" x="440" y="678">returned_on (NULL=미반납)</text>

  <!-- book_authors -->
  <rect class="box" x="820" y="470" width="260" height="192"/>
  <rect class="head" x="820" y="470" width="260" height="48"/>
  <text class="title" x="840" y="501">book_authors</text>
  <text class="key" x="840" y="542">PK, FK  book_id</text>
  <text class="key" x="840" y="570">PK, FK  author_id</text>
  <text class="field" x="840" y="598">author_order</text>
  <text class="field" x="840" y="630">도서-저자 N:M 연결</text>

  <text class="field" x="40" y="775">표기: 화살표 방향은 부모(1)에서 자식(N)을 가리킨다. book_authors의 두 FK가 도서와 저자의 N:M 관계를 해소한다.</text>
</svg>

