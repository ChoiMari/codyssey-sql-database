name: codyssey-library-sql

services:
  mysql:
    # MySQL 8.4 LTS 계열을 사용한다. SQL 파일도 MySQL 8.4 기준이다.
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      # named volume이므로 컨테이너를 다시 만들어도 DB 데이터가 유지된다.
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  adminer:
    # 설치가 필요 없는 브라우저 SQL 실행 화면이다.
    image: adminer:6
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "8080:8080"

volumes:
  mysql_data:
    name: codyssey_library_mysql_data
